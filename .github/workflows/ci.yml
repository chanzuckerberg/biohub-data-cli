name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre_commit_checks:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check backend
        uses: pre-commit/action@v3.0.1

  run-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UV_FROZEN: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        run: uv run pytest -v tests/ --cov=biohub_data_cli --cov-report=term-missing --cov-report=xml

      - name: Generate coverage badge
        if: github.event_name == 'push'
        run: |
          mkdir -p badges
          uv run --with "genbadge[coverage]" genbadge coverage -i coverage.xml -o badges/coverage.svg

      - name: Deploy badges
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          publish_branch: badges
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  build-package:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          pip install "build>=1.2,<2"
          python -m build

  # Catches syntax / import / dep-resolution issues across the Python versions
  # we claim to support (`requires-python = ">=3.10"` in pyproject.toml).
  # Uses pip — not uv — to exercise the install path real users follow.
  python-version-compatibility:
    name: install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and exercise entry point
        run: |
          python -m pip install --upgrade pip
          pip install .
          ops-data --help
