[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biohub-data-cli"
version = "0.1.0"
description = "Biohub data CLI"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "requests>=2.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
ops-data = "biohub_data_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
]
