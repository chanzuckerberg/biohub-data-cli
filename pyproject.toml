[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biohub-data-cli"
version = "0.1.1"
description = "Biohub data CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "requests>=2.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "amplitude-analytics>=1.1.1",
    "platformdirs>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/chanzuckerberg/biohub-data-cli"
Repository = "https://github.com/chanzuckerberg/biohub-data-cli"
Issues = "https://github.com/chanzuckerberg/biohub-data-cli/issues"

[project.scripts]
ops-data = "biohub_data_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_functions = ["test_*"]
# Integration tests hit live S3/HTTP and are deselected by default.
# Run them explicitly with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit real S3 buckets / HTTP servers",
    "slow: tests that download large fixtures (~GB+)",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
]
